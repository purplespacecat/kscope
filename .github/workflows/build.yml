name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Fast feedback on every push/PR: the Go core and the frontend build without
  # needing the webview toolchain.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Frontend
        working-directory: web
        # `npm run build` must run before `go build`: web/dist is embedded via
        # //go:embed, and only a .gitkeep is committed.
        run: |
          npm ci
          npm run lint
          npx tsc -b
          npm run build

      - name: Go
        run: |
          go vet ./...
          go test ./...

      - name: Desktop entry
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
          desktop-file-validate packaging/kscope.desktop

  # Only on a tag: the packaging path is slow (webview toolchain) and its
  # output is only useful for a release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Webview toolchain
        # Ubuntu 24.04 ships webkit2gtk-4.1, matching the webkit2_41 build tag
        # set in cmd/kscope-desktop/wails.json.
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Tools
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Package
        # scripts/package.sh refuses to run without VERSION, so a mislabelled
        # 0.0.0~rc0 artifact can't reach a release.
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/package.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.rpm
            dist/*.deb
            cmd/kscope-desktop/build/bin/kscope-desktop
          generate_release_notes: true
