<!-- kscope app icon. Regenerate the PNG with:
     magick -background none -density 300 packaging/icon.svg -resize 512x512 cmd/kscope-desktop/build/appicon.png
     White-on-blue-hexagon per k8s ecosystem convention; deliberately NOT the CNCF-trademarked wheel. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="hex" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7BEF"/>
      <stop offset="1" stop-color="#2557C7"/>
    </linearGradient>
  </defs>
  <!-- pointy-top hexagon, k8s-ecosystem convention; thick same-color stroke fakes rounded corners -->
  <polygon points="256,30 453,143 453,369 256,482 59,369 59,143"
           fill="url(#hex)" stroke="url(#hex)" stroke-width="36" stroke-linejoin="round"/>
  <!-- containment tree: root -> two children -> leaves -->
  <g stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" opacity="0.92">
    <line x1="256" y1="150" x2="172" y2="256"/>
    <line x1="256" y1="150" x2="340" y2="256"/>
    <line x1="172" y1="256" x2="128" y2="366"/>
    <line x1="172" y1="256" x2="216" y2="366"/>
    <line x1="340" y1="256" x2="296" y2="366"/>
    <line x1="340" y1="256" x2="384" y2="366"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="256" cy="150" r="34"/>
    <circle cx="172" cy="256" r="27"/>
    <circle cx="128" cy="366" r="21"/>
    <circle cx="216" cy="366" r="21"/>
    <circle cx="296" cy="366" r="21"/>
  </g>
  <circle cx="340" cy="256" r="27" fill="#FFFFFF"/>
  <circle cx="384" cy="366" r="21" fill="#FFFFFF"/>
</svg>
